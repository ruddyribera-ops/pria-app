server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver — re-resolves on each request, no caching
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Allow PDF uploads up to 50MB (multer limit is 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/markdown;

    # Use variable so nginx re-resolves the upstream on each request
    location /api/ {
        set $upstream http://pria-backend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Allow large file uploads to pass through without buffering
    location /api/materials {
        set $upstream http://pria-backend:3000;
        proxy_pass $upstream;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure .mjs files (like pdf.worker.min.mjs) get correct MIME type
    types {
        application/javascript mjs;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
